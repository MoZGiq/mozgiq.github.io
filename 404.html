<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Страница утеряна | 404</title>
  <style>
    /* Базовые стили и сброс */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #0b0b0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Декоративные светящиеся сферы на фоне */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      z-index: 1;
      pointer-events: none;
    }
    .glow-1 {
      background: #7f00ff;
      top: -10%;
      left: 10%;
      animation: float 8s ease-in-out infinite;
    }
    .glow-2 {
      background: #00f2fe;
      bottom: -10%;
      right: 10%;
      animation: float 8s ease-in-out infinite alternate;
    }

    /* Главный контейнер (эффект стекла) */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: fadeIn 1s ease-out;
    }

    /* Анимированная цифра 404 */
    h1 {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0, 242, 254, 0.3));
      animation: pulse 3s infinite alternate;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #f1f1f1;
    }

    p {
      color: #a0aec0;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Стильная кнопка */
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #0b0b0f;
      text-decoration: none;
      font-weight: bold;
      border-radius: 50px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
      filter: brightness(1.1);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    /* Анимации */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes pulse {
      0% { filter: drop-shadow(0 2px 8px rgba(0, 242, 254, 0.3)); }
      100% { filter: drop-shadow(0 2px 20px rgba(0, 242, 254, 0.6)); }
    }

    /* Адаптивность для мобилок */
    @media (max-width: 480px) {
      h1 { font-size: 6rem; }
      .card { padding: 40px 20px; }
    }
  </style>
</head>
<body>

  <!-- Задний план со свечением -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- Основной контент -->
  <div class="card">
    <h1>404</h1>
    <h2>Страница потерялась</h2>
    <p>Кажется, этой страницы не существует или её сьели.</p>
    <a href="https://mozgiq.github.io/my_bio/" class="btn">На главную</a>
  </div>

</body>
</html>
